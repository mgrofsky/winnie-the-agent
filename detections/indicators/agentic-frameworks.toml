# Indicators of agentic offensive frameworks, with where each fact comes from.
#
# User agents are trivially changed and some are shared with other tools, so no entry here
# is more than medium confidence. A match is shown on the triage record and can be used in
# a playbook condition; it never changes the record's judgement or reaches the blocklist.
# Paths and queries are requests one report listed from this activity; they are low
# confidence and carry no framework, since any scanner may request them.

[[indicators]]
id = "artex-ua-enrich"
type = "user_agent"
match = "prefix"
value = "artex-enrich/"
framework = "ARTEX"
label = "ARTEX default user agent (asset enrichment)"
confidence = "medium"
sources = ["https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/"]
reported = "2026-11-25"
notes = "Microsoft lists artex-enrich/* as sent with a short GET to each newly discovered web asset, without following redirects. Microsoft says threat actors using ARTEX can and do vary the user agent string."

[[indicators]]
id = "artex-ua-norma"
type = "user_agent"
match = "prefix"
value = "norma/"
framework = "ARTEX"
label = "ARTEX default user agent (agent web fetch)"
confidence = "medium"
sources = [
    "https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/",
    "https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors",
]
reported = "2026-11-25"
notes = "Microsoft lists norma/* as sent by the agents' built-in web-fetch tool. Wiz lists norma/0.4 and notes that many user agents in its list are not unique to this actor. Microsoft says threat actors using ARTEX can and do vary the user agent string."

[[indicators]]
id = "artex-ua-reconprobe"
type = "user_agent"
match = "exact"
value = "ReconProbe/1.0"
framework = "ARTEX"
label = "Self-describing scanner user agent seen with ARTEX activity"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz names ReconProbe/1.0 as a distinctive identifier in the activity, and says many user agents in its list are not unique to this actor and are noisy when hunted alone."

[[indicators]]
id = "recon-env-js"
type = "path"
match = "exact"
value = "/env.js"
label = "Runtime configuration fetch (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz lists GET /env.js among requests that showed up minutes after first contact, before the agent called internal API routes by name."

[[indicators]]
id = "recon-assets-config-json"
type = "path"
match = "exact"
value = "/assets/config.json"
label = "Runtime configuration fetch (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz lists GET /assets/config.json among requests that showed up minutes after first contact, before the agent called internal API routes by name."

[[indicators]]
id = "recon-packs-js"
type = "path"
match = "prefix"
value = "/packs/js/"
label = "Bundle or source map fetch under /packs/js/ (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz lists GET of a .js.map source map under /packs/js/ and says the internal route names the agent later called appear only in the source maps it had just downloaded. This entry matches any request under that directory."

[[indicators]]
id = "recon-swagger-openapi"
type = "query"
match = "exact"
value = "/swagger/?format=openapi"
label = "OpenAPI document fetch (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz lists GET /swagger/?format=openapi among requests that showed up minutes after first contact, before the agent called internal API routes by name."

[[indicators]]
id = "recon-sso-jwt"
type = "query"
match = "prefix"
value = "/sso?jwt="
label = "Token passed to a single sign-on endpoint (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz lists GET /sso with an unsigned token in the jwt parameter among requests testing unsigned JWTs."

[[indicators]]
id = "recon-validate-username"
type = "path"
match = "exact"
value = "/Account/ValidateUserName"
label = "Username existence check (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz reports the agent checked which usernames existed, then hammered the reset endpoints; this is one of the requests it lists. Wiz shows it with a UserName query."

[[indicators]]
id = "recon-password-reset-token"
type = "path"
match = "contains"
value = "/GeneratePasswordResetToken"
label = "Password reset token request (reconnaissance path)"
confidence = "low"
sources = ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
reported = "2026-10-22"
notes = "Wiz reports the agent checked which usernames existed, then hammered the reset endpoints; this is one of the requests it lists. Wiz shows a POST under a versioned users API path; this entry matches the endpoint name anywhere in the path."

