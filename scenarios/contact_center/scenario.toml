# An invented outsourced contact center (inbound support and outbound collections reminders)
# running Asterisk queues with an in-house agent desktop. The organisation, hosts, networks,
# people, client codes and credentials are {{...}} templates expanded from each sensor's seed
# (see docs/scenarios.md), so no two sensors show the same ones. Phone numbers use the NANP
# 555-01xx fictional range.

name = "contact_center"
title = "{{org.name}} agent platform"
description = """
An invented BPO contact center. Asterisk 20 handles SIP trunks and agent extensions, an
in-house agent desktop / supervisor console sits behind nginx with a small REST API for
queues and agents, PostgreSQL holds the CRM, and an FTP share carries call recordings and
nightly CRM exports for clients. Honeytokens sit in the dialer env file, the trunk config
backup, the recording-archive script and the CRM integration table.
"""

[bait]
org_suffixes = ["Contact Solutions", "Customer Care", "Contact Centers", "CX Services", "Teleservices", "Call Center Services"]
domain_words = ["cx", "contact", "care", "calls"]

[identity]
org_name = "{{org.name}}"
hostname = "{{host:cc-app}}"
domain = "{{org.domain}}"
internal_ips = ["{{net:app}}.12", "{{net:data}}.12"]
os_pretty_name = "Ubuntu 22.04.4 LTS"
kernel = "Linux {{host:cc-app}} 5.15.0-118-generic #128-Ubuntu SMP Fri Jul 5 09:28:59 UTC 2024 x86_64 x86_64 x86_64 GNU/Linux"
timezone = "America/New_York"
lures = [
    "/opt/{{org.slug}}/desktop/.env",
    "/opt/{{org.slug}}/dialer/dialer.env",
    "/etc/asterisk/pjsip_trunks.conf",
    "/etc/asterisk/queues.conf",
    "/srv/recordings/archive.sh",
    "/home/ccadmin/.pgpass",
]

[[identity.users]]
name = "ccadmin"
uid = 1000
gecos = "Contact center admin"
home = "/home/ccadmin"

[[identity.users]]
name = "{{org.abbr}}desk"
uid = 1101
gecos = "Agent desktop service"
home = "/opt/{{org.slug}}/desktop"
shell = "/usr/sbin/nologin"

[[identity.users]]
name = "asterisk"
uid = 115
gecos = "Asterisk PBX"
home = "/var/lib/asterisk"
shell = "/usr/sbin/nologin"

[ssh]
persona_prompt = """
This is {{host:cc-app}}, the main application server for {{org.name}}, an outsourced
contact center. Asterisk 20.9.2 runs queues 8100-8109 and agent extensions 3000-3199, with
two SIP trunks ({{org.abbr}}-trunk-primary and {{org.abbr}}-trunk-dr). The agent desktop and supervisor console
is a Node 20 app in /opt/{{org.slug}}/desktop (systemd unit {{org.abbr}}-desktop, port 3000) behind nginx
1.24; its REST API lives at /api/v1. The predictive dialer worker is in /opt/{{org.slug}}/dialer
(dialer.env holds its settings). PostgreSQL 15 on {{net:data}}.20 holds the crm database; psql
access uses ~/.pgpass. Call recordings are written to /srv/recordings/YYYY/MM/DD and shared
over vsftpd along with /srv/exports (nightly CRM CSV exports for clients). Cron:
/srv/recordings/archive.sh at 01:30 moves recordings older than 30 days to object storage,
/opt/{{org.slug}}/bin/crm-export.sh at 00:45, certbot renew twice daily. Users ccadmin (sudo)
and {{org.abbr}}desk (service account). Keep every answer consistent with this host.
"""

[[ssh.accounts]]
username = "ccadmin"
password = "{{password:ccadmin}}"

[[ssh.accounts]]
username = "root"
password = "{{password:root:weak}}"

# ---- SIP --------------------------------------------------------------------------------

[services.sip]
enabled = true
port = 5060
realm = "{{org.domain}}"
server_header = "Asterisk PBX 20.9.2"
extension_ranges = ["3000-3199", "8100-8109", "9000-9001"]
dial_plan_hints = [
    "3000-3199: agent extensions (hot-desk, login with agent PIN)",
    "8100: client A tier-1 support queue, 8101: tier-2, 8105: collections reminders",
    "9000 / 9001: trunk peers {{org.abbr}}-trunk-primary and {{org.abbr}}-trunk-dr",
    "Outbound: 1 + 10 digits on {{org.abbr}}-trunk-primary, failover to {{org.abbr}}-trunk-dr",
    "*45: agent queue login/logout, *8: directed pickup",
]

[services.sip.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 6

[[services.sip.extensions]]
extension = "3001"
password = "{{password:3001:user}}"
display_name = "Agent {{person:1.full_name}}"

[[services.sip.extensions]]
extension = "3002"
password = "{{password:3002:user}}"
display_name = "Agent {{person:2.full_name}}"

[[services.sip.extensions]]
extension = "3050"
password = "{{password:ext3050}}"
display_name = "Supervisor {{person:3.full_name}}"

[[services.sip.extensions]]
extension = "9000"
password = "{{ht:trunk_password}}"
display_name = "{{org.abbr}}-trunk-primary"

# ---- PostgreSQL CRM ---------------------------------------------------------------------

[services.postgres]
enabled = true
port = 5432
version = "15.8 (Ubuntu 15.8-1.pgdg22.04+1)"

[services.postgres.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

[[services.postgres.accounts]]
username = "crm_app"
password = "{{ht:crm_db_password}}"

[[services.postgres.accounts]]
username = "reporting"
password = "{{password:reporting:user}}"

[[services.postgres.databases]]
name = "crm"

[[services.postgres.databases.tables]]
name = "customers"
columns = [
    { name = "customer_id", type = "int" },
    { name = "client_code", type = "varchar" },
    { name = "full_name", type = "varchar" },
    { name = "phone", type = "varchar" },
    { name = "email", type = "varchar" },
    { name = "account_ref", type = "varchar" },
    { name = "balance_due", type = "numeric" },
    { name = "created_at", type = "timestamp" },
]

[services.postgres.databases.tables.generator]
count = 80
[services.postgres.databases.tables.generator.fields]
customer_id = { kind = "seq", min = 10001 }
client_code = { kind = "choice", choices = ["UTIL-{{digits:3:client_util}}", "ISP-{{digits:3:client_isp}}", "INS-{{digits:3:client_ins}}"] }
full_name = { kind = "full_name" }
phone = { kind = "phone" }
email = { kind = "email" }
account_ref = { kind = "account_number", prefix = "{{org.ABBR}}-" }
balance_due = { kind = "amount", min = 0, max = 2400 }
created_at = { kind = "datetime", min = 0, max = 310 }

[[services.postgres.databases.tables]]
name = "interactions"
columns = [
    { name = "interaction_id", type = "uuid" },
    { name = "customer_id", type = "int" },
    { name = "agent_ext", type = "varchar" },
    { name = "queue", type = "varchar" },
    { name = "channel", type = "varchar" },
    { name = "disposition", type = "varchar" },
    { name = "notes", type = "text" },
    { name = "started_at", type = "timestamp" },
]

[services.postgres.databases.tables.generator]
count = 120
[services.postgres.databases.tables.generator.fields]
interaction_id = { kind = "uuid" }
customer_id = { kind = "int", min = 10001, max = 10080 }
agent_ext = { kind = "extension", min = 3001, max = 3060 }
queue = { kind = "choice", choices = ["8100", "8101", "8105"] }
channel = { kind = "choice", choices = ["voice", "voice", "voice", "chat", "email"] }
disposition = { kind = "choice", choices = ["resolved", "callback", "escalated", "promise_to_pay", "no_answer"] }
notes = { kind = "sentence" }
started_at = { kind = "datetime", min = 270, max = 317 }

[[services.postgres.databases.tables]]
name = "agents"
columns = [
    { name = "agent_id", type = "int" },
    { name = "extension", type = "varchar" },
    { name = "full_name", type = "varchar" },
    { name = "email", type = "varchar" },
    { name = "role", type = "varchar" },
    { name = "team", type = "varchar" },
    { name = "status", type = "varchar" },
]
seed_rows = [
    [1, "3001", "{{person:1.full_name}}", "{{person:1.email}}", "agent", "UTIL-{{digits:3:client_util}}", "available"],
    [2, "3002", "{{person:2.full_name}}", "{{person:2.email}}", "agent", "ISP-{{digits:3:client_isp}}", "on_call"],
    [3, "3050", "{{person:3.full_name}}", "{{person:3.email}}", "supervisor", "ALL", "available"],
]

[services.postgres.databases.tables.generator]
count = 30
[services.postgres.databases.tables.generator.fields]
agent_id = { kind = "seq", min = 1 }
extension = { kind = "extension", min = 3003, max = 3060 }
full_name = { kind = "full_name" }
email = { kind = "email" }
role = { kind = "const", value = "agent" }
team = { kind = "choice", choices = ["UTIL-{{digits:3:client_util}}", "ISP-{{digits:3:client_isp}}", "INS-{{digits:3:client_ins}}"] }
status = { kind = "choice", choices = ["available", "on_call", "wrap_up", "break", "offline"] }

[[services.postgres.databases.tables]]
name = "queues"
columns = [
    { name = "queue_id", type = "varchar" },
    { name = "name", type = "varchar" },
    { name = "client_code", type = "varchar" },
    { name = "strategy", type = "varchar" },
    { name = "sla_seconds", type = "int" },
    { name = "agents_logged_in", type = "int" },
]
seed_rows = [
    ["8100", "Tier 1 Support", "UTIL-{{digits:3:client_util}}", "rrmemory", 30, 14],
    ["8101", "Tier 2 Support", "UTIL-{{digits:3:client_util}}", "leastrecent", 60, 4],
    ["8102", "Billing", "ISP-{{digits:3:client_isp}}", "rrmemory", 45, 6],
    ["8105", "Payment Reminders", "INS-{{digits:3:client_ins}}", "ringall", 120, 3],
]

[[services.postgres.databases.tables]]
name = "integration_keys"
columns = [
    { name = "id", type = "int" },
    { name = "client_code", type = "varchar" },
    { name = "purpose", type = "varchar" },
    { name = "api_key", type = "varchar", secret = true },
    { name = "created_by", type = "varchar" },
    { name = "active", type = "bool" },
]
seed_rows = [
    [1, "UTIL-{{digits:3:client_util}}", "ticket sync webhook", "{{ht:crm_api_key}}", "ccadmin", true],
    [2, "ISP-{{digits:3:client_isp}}", "nightly export pull", "{{secret:api_key:isp_export_key}}", "ccadmin", false],
]

# ---- FTP: recordings and exports --------------------------------------------------------

# Workforce management (scheduling, adherence) on SQL Server, as many contact-center
# WFM suites ship.
[services.mssql]
enabled = true
port = 1433
version = "15.0.4322.2"

[services.mssql.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

[[services.mssql.accounts]]
username = "wfm_svc"
password = "{{password:wfm_svc:service}}"

[[services.mssql.databases]]
name = "WFM"
schema_name = "dbo"

[[services.mssql.databases.tables]]
name = "agent_schedule"
columns = [
    { name = "schedule_id", type = "int" },
    { name = "agent_ext", type = "varchar" },
    { name = "agent_name", type = "varchar" },
    { name = "shift_date", type = "date" },
    { name = "skill_group", type = "varchar" },
]

[services.mssql.databases.tables.generator]
count = 60
[services.mssql.databases.tables.generator.fields]
schedule_id = { kind = "seq", min = 5001 }
agent_ext = { kind = "extension", min = 2001, max = 2060 }
agent_name = { kind = "full_name" }
shift_date = { kind = "date", min = 280, max = 320 }
skill_group = { kind = "choice", choices = ["billing", "outage", "retention", "collections"] }

[services.ftp]
enabled = true
port = 2121
banner = "220 (vsFTPd 3.0.5)"
version = "vsFTPd 3.0.5"

[services.ftp.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

[[services.ftp.accounts]]
username = "util-{{digits:3:client_util}}"
password = "{{password:client_util_ftp:service}}"

[[services.ftp.accounts]]
username = "qa"
password = "{{password:qa:user}}"

[[services.ftp.files]]
path = "/recordings/2026/11/14/q8100-3001-20261114-091502-{{hex:4:rec1}}.wav"
size = 2381044
mtime = "2026-11-14 09:21"

[[services.ftp.files]]
path = "/recordings/2026/11/14/q8100-3002-20261114-093318-{{hex:4:rec2}}.wav"
size = 1120388
mtime = "2026-11-14 09:36"

[[services.ftp.files]]
path = "/recordings/2026/11/14/q8105-3017-20261114-101144-{{hex:4:rec3}}.wav"
size = 3904112
mtime = "2026-11-14 10:18"

[[services.ftp.files]]
path = "/recordings/2026/11/13/q8101-3050-20261113-161209-{{hex:4:rec4}}.wav"
size = 5120876
mtime = "2026-11-13 16:29"

[[services.ftp.files]]
path = "/recordings/archive.sh"
mtime = "2026-05-02 10:12"
content = '''
#!/bin/bash
# Move recordings older than 30 days to cold storage. Runs from cron at 01:30.
export AWS_ACCESS_KEY_ID={{ht:recording_aws_key}}
export AWS_DEFAULT_REGION=us-east-1
find /srv/recordings -name '*.wav' -mtime +30 -print0 | while IFS= read -r -d '' f; do
  aws s3 mv "$f" "s3://{{org.abbr}}-recordings-archive/${f#/srv/recordings/}" --storage-class GLACIER
done
'''

[[services.ftp.files]]
