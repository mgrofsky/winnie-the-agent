[[services.http.routes]]
method = "GET"
path = "/api/v1/queues"
auth = "any"
list_from = "crm.queues"

[[services.http.routes]]
method = "GET"
path = "/api/v1/queues/{queue_id}"
auth = "any"
item_from = "crm.queues"
item_key = "queue_id"

[[services.http.routes]]
method = "GET"
path = "/api/v1/queues/{queue_id}/stats"
auth = "any"
[services.http.routes.json_body]
queue_id = "{queue_id}"
waiting = 3
longest_wait_seconds = 74
answered_today = 412
abandoned_today = 19
service_level_pct = 89.4

[[services.http.routes]]
method = "GET"
path = "/api/v1/agents"
auth = "any"
list_from = "crm.agents"
list_limit = 50

[[services.http.routes]]
method = "GET"
path = "/api/v1/agents/{agent_id}"
auth = "any"
item_from = "crm.agents"
item_key = "agent_id"

[[services.http.routes]]
method = "POST"
path = "/api/v1/agents/{agent_id}/status"
auth = "any"
[services.http.routes.json_body]
agent_id = "{agent_id}"
status = "accepted"

[[services.http.routes]]
method = "GET"
path = "/api/v1/integrations"
auth = "session"
[services.http.routes.json_body]
webhooks = [
    { client = "NRTH-UTIL", url = "https://hooks.larkspur-cx.example/nrth/tickets", header = "X-Larkspur-Key", key = "{{ht:crm_api_key}}" },
]

# ---- honeytokens ---------------------------------------------------------------------------

[[honeytokens]]
name = "trunk_password"
kind = "sip_trunk_password"
planted_in = [
    "FTP /config/pjsip_trunks.conf (lk-trunk-primary-auth password)",
    "SIP extension 9000 (trunk peer) password",
]

[[honeytokens]]
name = "crm_db_password"
kind = "db_password"
planted_in = ["FTP /config/dialer.env (CRM_DATABASE_URL for postgres user crm_app)"]

[[honeytokens]]
name = "recording_aws_key"
kind = "aws_access_key"
planted_in = ["FTP /recordings/archive.sh (AWS_ACCESS_KEY_ID)"]

[[honeytokens]]
name = "crm_api_key"
kind = "api_key"
planted_in = [
    "Postgres crm.integration_keys row 1 (api_key)",
    "HTTP GET /api/v1/integrations (webhook key)",
]
