# ---- HTTP: agent desktop, supervisor console, REST API -----------------------------------

[services.http]
enabled = true
port = 8080
server_header = "nginx/1.24.0 (Ubuntu)"
login_path = "/login"
login_title = "{{org.short}} Agent Desktop - Sign in"
branding = "{{org.name}} - Agent Desktop and Supervisor Console v4.12.3"
api_prefix = "/api/v1"

[services.http.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

[[services.http.accounts]]
username = "{{person:3.username}}"
password = "{{password:person3}}"

[[services.http.accounts]]
username = "agent3001"
password = "{{password:agent3001_web:weak}}"

[[services.http.pages]]
path = "/desktop"
title = "Agent Desktop"
body_html = '''
<h1>Agent Desktop</h1>
<p>Extension 3001 - Status: <b>Available</b> - Queues: 8100 Tier 1 Support, 8102 Billing</p>
<div id="softphone">Softphone: registered to sip.{{org.domain}}</div>
<div id="script">Greeting: "Thank you for calling, my name is ... how can I help you today?"</div>
'''

[[services.http.pages]]
path = "/supervisor"
title = "Supervisor Console"
body_html = '''
<h1>Supervisor Console</h1>
<table>
<tr><th>Queue</th><th>Waiting</th><th>Longest wait</th><th>Agents</th><th>SLA</th></tr>
<tr><td>8100 Tier 1 Support</td><td>4</td><td>0:52</td><td>14</td><td>91%</td></tr>
<tr><td>8101 Tier 2 Support</td><td>1</td><td>2:10</td><td>4</td><td>78%</td></tr>
<tr><td>8102 Billing</td><td>0</td><td>0:00</td><td>6</td><td>97%</td></tr>
<tr><td>8105 Payment Reminders</td><td>2</td><td>1:31</td><td>3</td><td>84%</td></tr>
</table>
<p><a href="/supervisor/recordings">Recordings</a> | <a href="/supervisor/exports">Client exports</a></p>
'''

[[services.http.pages]]
path = "/supervisor/exports"
title = "Client Exports"
body_html = '''
<h1>Client Exports</h1>
<p>Nightly CSV exports are written to /srv/exports/&lt;client&gt;/ and published on the FTP share at 00:45.</p>
<ul><li>util-{{digits:3:client_util}}/crm-export-20261114.csv</li><li>isp-{{digits:3:client_isp}}/crm-export-20261114.csv</li></ul>
'''

[[services.http.routes]]
method = "GET"
path = "/api/v1/queues"
auth = "any"
list_from = "crm.queues"

[[services.http.routes]]
method = "GET"
path = "/api/v1/queues/{queue_id}"
auth = "any"
item_from = "crm.queues"
item_key = "queue_id"

[[services.http.routes]]
method = "GET"
path = "/api/v1/queues/{queue_id}/stats"
auth = "any"
[services.http.routes.json_body]
queue_id = "{queue_id}"
waiting = 3
longest_wait_seconds = 74
answered_today = 412
abandoned_today = 19
service_level_pct = 89.4

[[services.http.routes]]
method = "GET"
path = "/api/v1/agents"
auth = "any"
list_from = "crm.agents"
list_limit = 50

[[services.http.routes]]
method = "GET"
path = "/api/v1/agents/{agent_id}"
auth = "any"
item_from = "crm.agents"
item_key = "agent_id"

[[services.http.routes]]
method = "POST"
path = "/api/v1/agents/{agent_id}/status"
auth = "any"
[services.http.routes.json_body]
agent_id = "{agent_id}"
status = "accepted"

[[services.http.routes]]
method = "GET"
path = "/api/v1/integrations"
auth = "session"
[services.http.routes.json_body]
webhooks = [
    { client = "UTIL-{{digits:3:client_util}}", url = "https://hooks.{{org.domain}}/util-{{digits:3:client_util}}/tickets", header = "X-{{org.ABBR}}-Key", key = "{{ht:crm_api_key}}" },
]

# ---- honeytokens ---------------------------------------------------------------------------

[[honeytokens]]
name = "trunk_password"
kind = "sip_trunk_password"
planted_in = [
    "FTP /config/pjsip_trunks.conf ({{org.abbr}}-trunk-primary-auth password)",
    "SIP extension 9000 (trunk peer) password",
]

[[honeytokens]]
name = "crm_db_password"
kind = "db_password"
planted_in = ["FTP /config/dialer.env (CRM_DATABASE_URL for postgres user crm_app)"]

[[honeytokens]]
name = "recording_aws_key"
kind = "aws_access_key"
planted_in = ["FTP /recordings/archive.sh (AWS_ACCESS_KEY_ID)"]

[[honeytokens]]
name = "crm_api_key"
kind = "api_key"
planted_in = [
    "Postgres crm.integration_keys row 1 (api_key)",
    "HTTP GET /api/v1/integrations (webhook key)",
]
