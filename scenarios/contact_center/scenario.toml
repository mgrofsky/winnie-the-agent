# Larkspur Contact Solutions: an invented outsourced contact center (inbound support and
# outbound collections reminders) running Asterisk queues with an in-house agent desktop.

name = "contact_center"
title = "Larkspur Contact Solutions agent platform"
description = """
An invented BPO contact center. Asterisk 20 handles SIP trunks and agent extensions, an
in-house agent desktop / supervisor console sits behind nginx with a small REST API for
queues and agents, PostgreSQL holds the CRM, and an FTP share carries call recordings and
nightly CRM exports for clients. Honeytokens sit in the dialer env file, the trunk config
backup, the recording-archive script and the CRM integration table.
"""

[identity]
org_name = "Larkspur Contact Solutions"
hostname = "cc-app02"
domain = "larkspur-cx.example"
internal_ips = ["10.60.2.12", "10.60.10.12"]
os_pretty_name = "Ubuntu 22.04.4 LTS"
kernel = "Linux cc-app02 5.15.0-118-generic #128-Ubuntu SMP Fri Jul 5 09:28:59 UTC 2024 x86_64 x86_64 x86_64 GNU/Linux"
timezone = "America/New_York"
lures = [
    "/opt/larkspur/desktop/.env",
    "/opt/larkspur/dialer/dialer.env",
    "/etc/asterisk/pjsip_trunks.conf",
    "/etc/asterisk/queues.conf",
    "/srv/recordings/archive.sh",
    "/home/ccadmin/.pgpass",
]

[[identity.users]]
name = "ccadmin"
uid = 1000
gecos = "Contact center admin"
home = "/home/ccadmin"

[[identity.users]]
name = "lkdesk"
uid = 1101
gecos = "Agent desktop service"
home = "/opt/larkspur/desktop"
shell = "/usr/sbin/nologin"

[[identity.users]]
name = "asterisk"
uid = 115
gecos = "Asterisk PBX"
home = "/var/lib/asterisk"
shell = "/usr/sbin/nologin"

[ssh]
persona_prompt = """
This is cc-app02, the main application server for Larkspur Contact Solutions, an outsourced
contact center. Asterisk 20.9.2 runs queues 8100-8109 and agent extensions 3000-3199, with
two SIP trunks (lk-trunk-primary and lk-trunk-dr). The agent desktop and supervisor console
is a Node 20 app in /opt/larkspur/desktop (systemd unit lk-desktop, port 3000) behind nginx
1.24; its REST API lives at /api/v1. The predictive dialer worker is in /opt/larkspur/dialer
(dialer.env holds its settings). PostgreSQL 15 on 10.60.10.20 holds the crm database; psql
access uses ~/.pgpass. Call recordings are written to /srv/recordings/YYYY/MM/DD and shared
over vsftpd along with /srv/exports (nightly CRM CSV exports for clients). Cron:
/srv/recordings/archive.sh at 01:30 moves recordings older than 30 days to object storage,
/opt/larkspur/bin/crm-export.sh at 00:45, certbot renew twice daily. Users ccadmin (sudo)
and lkdesk (service account). Keep every answer consistent with this host.
"""

[[ssh.accounts]]
username = "ccadmin"
password = "Larkspur#2023"

[[ssh.accounts]]
username = "root"
password = "toor"

# ---- SIP --------------------------------------------------------------------------------

[services.sip]
enabled = true
port = 5060
realm = "larkspur-cx.example"
server_header = "Asterisk PBX 20.9.2"
extension_ranges = ["3000-3199", "8100-8109", "9000-9001"]
dial_plan_hints = [
    "3000-3199: agent extensions (hot-desk, login with agent PIN)",
    "8100: client A tier-1 support queue, 8101: tier-2, 8105: collections reminders",
    "9000 / 9001: trunk peers lk-trunk-primary and lk-trunk-dr",
    "Outbound: 1 + 10 digits on lk-trunk-primary, failover to lk-trunk-dr",
    "*45: agent queue login/logout, *8: directed pickup",
]

[services.sip.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 6

[[services.sip.extensions]]
extension = "3001"
password = "agent3001"
display_name = "Agent Harper Pemberton"

[[services.sip.extensions]]
extension = "3002"
password = "3002"
display_name = "Agent Quinn Ferreira"

[[services.sip.extensions]]
extension = "3050"
password = "Lk3050!"
display_name = "Supervisor Morgan Whitlock"

[[services.sip.extensions]]
extension = "9000"
password = "{{ht:trunk_password}}"
display_name = "lk-trunk-primary"

# ---- PostgreSQL CRM ---------------------------------------------------------------------

[services.postgres]
enabled = true
port = 5432
version = "15.8 (Ubuntu 15.8-1.pgdg22.04+1)"

[services.postgres.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

[[services.postgres.accounts]]
username = "crm_app"
password = "crm_app_2022"

[[services.postgres.accounts]]
username = "reporting"
password = "reporting"

[[services.postgres.databases]]
name = "crm"

[[services.postgres.databases.tables]]
name = "customers"
columns = [
    { name = "customer_id", type = "int" },
    { name = "client_code", type = "varchar" },
    { name = "full_name", type = "varchar" },
    { name = "phone", type = "varchar" },
    { name = "email", type = "varchar" },
    { name = "account_ref", type = "varchar" },
    { name = "balance_due", type = "numeric" },
    { name = "created_at", type = "timestamp" },
]

[services.postgres.databases.tables.generator]
count = 80
[services.postgres.databases.tables.generator.fields]
customer_id = { kind = "seq", min = 10001 }
client_code = { kind = "choice", choices = ["NRTH-UTIL", "BLUEFERN-ISP", "ORCHARD-INS"] }
full_name = { kind = "full_name" }
phone = { kind = "phone" }
email = { kind = "email" }
account_ref = { kind = "account_number", prefix = "LK-" }
balance_due = { kind = "amount", min = 0, max = 2400 }
created_at = { kind = "datetime", min = 0, max = 310 }

[[services.postgres.databases.tables]]
name = "interactions"
columns = [
    { name = "interaction_id", type = "uuid" },
    { name = "customer_id", type = "int" },
    { name = "agent_ext", type = "varchar" },
    { name = "queue", type = "varchar" },
    { name = "channel", type = "varchar" },
    { name = "disposition", type = "varchar" },
    { name = "notes", type = "text" },
    { name = "started_at", type = "timestamp" },
]

[services.postgres.databases.tables.generator]
count = 120
[services.postgres.databases.tables.generator.fields]
interaction_id = { kind = "uuid" }
customer_id = { kind = "int", min = 10001, max = 10080 }
agent_ext = { kind = "extension", min = 3001, max = 3060 }
queue = { kind = "choice", choices = ["8100", "8101", "8105"] }
channel = { kind = "choice", choices = ["voice", "voice", "voice", "chat", "email"] }
disposition = { kind = "choice", choices = ["resolved", "callback", "escalated", "promise_to_pay", "no_answer"] }
notes = { kind = "sentence" }
started_at = { kind = "datetime", min = 270, max = 317 }

[[services.postgres.databases.tables]]
name = "agents"
columns = [
    { name = "agent_id", type = "int" },
    { name = "extension", type = "varchar" },
    { name = "full_name", type = "varchar" },
    { name = "email", type = "varchar" },
    { name = "role", type = "varchar" },
    { name = "team", type = "varchar" },
    { name = "status", type = "varchar" },
]
seed_rows = [
    [1, "3001", "Harper Pemberton", "harper.pemberton@larkspur-cx.example", "agent", "NRTH-UTIL", "available"],
    [2, "3002", "Quinn Ferreira", "quinn.ferreira@larkspur-cx.example", "agent", "BLUEFERN-ISP", "on_call"],
    [3, "3050", "Morgan Whitlock", "morgan.whitlock@larkspur-cx.example", "supervisor", "ALL", "available"],
]

[services.postgres.databases.tables.generator]
count = 30
[services.postgres.databases.tables.generator.fields]
agent_id = { kind = "seq", min = 1 }
extension = { kind = "extension", min = 3003, max = 3060 }
full_name = { kind = "full_name" }
email = { kind = "email" }
role = { kind = "const", value = "agent" }
team = { kind = "choice", choices = ["NRTH-UTIL", "BLUEFERN-ISP", "ORCHARD-INS"] }
status = { kind = "choice", choices = ["available", "on_call", "wrap_up", "break", "offline"] }

[[services.postgres.databases.tables]]
name = "queues"
columns = [
    { name = "queue_id", type = "varchar" },
    { name = "name", type = "varchar" },
    { name = "client_code", type = "varchar" },
    { name = "strategy", type = "varchar" },
    { name = "sla_seconds", type = "int" },
    { name = "agents_logged_in", type = "int" },
]
seed_rows = [
    ["8100", "Tier 1 Support", "NRTH-UTIL", "rrmemory", 30, 14],
    ["8101", "Tier 2 Support", "NRTH-UTIL", "leastrecent", 60, 4],
    ["8102", "Billing", "BLUEFERN-ISP", "rrmemory", 45, 6],
    ["8105", "Payment Reminders", "ORCHARD-INS", "ringall", 120, 3],
]

[[services.postgres.databases.tables]]
name = "integration_keys"
columns = [
    { name = "id", type = "int" },
    { name = "client_code", type = "varchar" },
    { name = "purpose", type = "varchar" },
    { name = "api_key", type = "varchar" },
    { name = "created_by", type = "varchar" },
    { name = "active", type = "bool" },
]
seed_rows = [
    [1, "NRTH-UTIL", "ticket sync webhook", "{{ht:crm_api_key}}", "ccadmin", true],
    [2, "BLUEFERN-ISP", "nightly export pull", "revoked-2026-08-01", "ccadmin", false],
]

# ---- FTP: recordings and exports --------------------------------------------------------

