[services.mssql.databases.tables.generator]
count = 60
[services.mssql.databases.tables.generator.fields]
schedule_id = { kind = "seq", min = 5001 }
agent_ext = { kind = "extension", min = 2001, max = 2060 }
agent_name = { kind = "full_name" }
shift_date = { kind = "date", min = 280, max = 320 }
skill_group = { kind = "choice", choices = ["billing", "outage", "retention", "collections"] }

