[[services.ftp.files]]
path = "/recordings/archive.sh"
mtime = "2026-05-02 10:12"
content = '''
#!/bin/bash
# Move recordings older than 30 days to cold storage. Runs from cron at 01:30.
export AWS_ACCESS_KEY_ID={{ht:recording_aws_key}}
export AWS_DEFAULT_REGION=us-east-1
find /srv/recordings -name '*.wav' -mtime +30 -print0 | while IFS= read -r -d '' f; do
  aws s3 mv "$f" "s3://larkspur-recordings-archive/${f#/srv/recordings/}" --storage-class GLACIER
done
'''

