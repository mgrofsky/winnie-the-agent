# An invented two-hospital regional health system. Every patient is synthetic (generated
# names, MRNs prefixed with the organisation abbreviation, NANP 555-01xx phones, example
# email domains). No real person, provider or facility is represented.
# The organisation, hosts, networks, people and credentials are {{...}} templates expanded
# from each sensor's seed (see docs/scenarios.md), so no two sensors show the same ones.

name = "healthcare"
title = "{{org.name}} EHR integration server"
description = """
An invented regional health system. One integration host serves the patient portal and the
EHR admin console, a FHIR R4-style REST API (Patient, Observation, Encounter), an HL7 v2
MLLP listener for inbound ADT/ORU feeds, a PostgreSQL clinical database and an FTP share
used by the lab and imaging interfaces. Honeytokens sit in the interface engine config,
the lab interface config, the offsite backup script and the FHIR client credentials table.
"""

[bait]
org_suffixes = ["Regional Health", "Health", "Health System", "Medical Center", "Healthcare", "Health Partners"]
domain_words = ["health", "med", "care", "hs"]

[identity]
org_name = "{{org.name}}"
hostname = "{{host:ehr-int}}"
domain = "{{org.domain}}"
internal_ips = ["{{net:app}}.41", "{{net:clinical}}.41"]
os_pretty_name = "Rocky Linux 9.4 (Blue Onyx)"
kernel = "Linux {{host:ehr-int}} 5.14.0-427.22.1.el9_4.x86_64 #1 SMP PREEMPT_DYNAMIC Wed Jun 12 19:43:39 UTC 2024 x86_64 x86_64 x86_64 GNU/Linux"
timezone = "America/Denver"
lures = [
    "/opt/{{org.abbr}}/interface-engine/conf/engine.properties",
    "/opt/{{org.abbr}}/interface-engine/channels/lab-oru-inbound.xml",
    "/opt/{{org.abbr}}/fhir/application.yaml",
    "/opt/{{org.abbr}}/scripts/offsite-backup.sh",
    "/var/log/{{org.abbr}}/mllp/inbound.log",
    "/home/integ/.pgpass",
]

[[identity.users]]
name = "integ"
uid = 1000
gecos = "Integration team"
home = "/home/integ"

[[identity.users]]
name = "fhirsvc"
uid = 1301
gecos = "FHIR API service"
home = "/opt/{{org.abbr}}/fhir"
shell = "/sbin/nologin"

[[identity.users]]
name = "hl7svc"
uid = 1302
gecos = "Interface engine"
home = "/opt/{{org.abbr}}/interface-engine"
shell = "/sbin/nologin"

[ssh]
persona_prompt = """
This is {{host:ehr-int}}, the clinical integration server for {{org.name}}, an
invented two-hospital health system ({{org.short}} General and {{org.short}} Community). It runs
the interface engine in /opt/{{org.abbr}}/interface-engine (Java 17, systemd unit {{org.abbr}}-engine) which
listens for HL7 v2 over MLLP on port 2575 (ADT from registration, ORU from the lab) and
writes to the clinical database; the FHIR R4 API in /opt/{{org.abbr}}/fhir (HAPI-based, unit
{{org.abbr}}-fhir, port 8080 behind nginx) serving /fhir/Patient, /fhir/Observation and
/fhir/Encounter; and the patient portal plus EHR admin console. PostgreSQL 15 on
{{net:clinical}}.60 holds the ehr_clinical database. vsftpd shares /srv/interfaces for lab and
imaging vendors (hl7/inbound, hl7/archive, exports). Cron: HL7 archive rotation at 00:30,
/opt/{{org.abbr}}/scripts/offsite-backup.sh at 02:00, nightly FHIR bulk export at 03:00, AIDE at
05:00. Users: integ (sudo), fhirsvc and hl7svc service accounts. All patient data is test
data from the integration environment refresh. Keep every answer consistent with this host.
"""

[[ssh.accounts]]
username = "integ"
password = "{{password:integ}}"

[[ssh.accounts]]
username = "root"
password = "{{password:root:weak}}"

# ---- MLLP (HL7 v2) ----------------------------------------------------------------------

[services.mllp]
enabled = true
port = 2575
sending_facility = "{{org.ABBR}}_EHR"

# ---- PostgreSQL clinical database --------------------------------------------------------

[services.postgres]
enabled = true
port = 5432
version = "15.7"

[services.postgres.policy]
accept = "after_n"
after_n_min = 3
after_n_max = 6

[[services.postgres.accounts]]
username = "ehr_app"
password = "{{ht:ehr_db_password}}"

[[services.postgres.accounts]]
username = "fhir_ro"
password = "{{password:fhir_ro:service}}"

[[services.postgres.databases]]
name = "ehr_clinical"
schema_name = "clinical"

[[services.postgres.databases.tables]]
name = "patients"
columns = [
    { name = "patient_id", type = "int" },
    { name = "mrn", type = "varchar" },
    { name = "first_name", type = "varchar" },
    { name = "last_name", type = "varchar" },
    { name = "birth_date", type = "date" },
    { name = "sex", type = "varchar" },
    { name = "phone", type = "varchar" },
    { name = "email", type = "varchar" },
    { name = "facility", type = "varchar" },
    { name = "portal_enabled", type = "bool" },
]
seed_rows = [
    [1001, "{{org.ABBR}}00412871", "{{person:1.first}}", "{{person:1.last}}", "1984-07-12", "female", "+13125550161", "{{person:1.username}}@example.com", "{{org.short}} General", true],
    [1002, "{{org.ABBR}}00412902", "{{person:2.first}}", "{{person:2.last}}", "1951-02-03", "male", "+16175550118", "", "{{org.short}} Community", false],
    [1003, "{{org.ABBR}}00413377", "{{person:3.first}}", "{{person:3.last}}", "2009-11-21", "male", "+19195550192", "{{person:3.username}}@example.org", "{{org.short}} General", true],
]

[services.postgres.databases.tables.generator]
count = 120
[services.postgres.databases.tables.generator.fields]
patient_id = { kind = "seq", min = 1001 }
mrn = { kind = "mrn", prefix = "{{org.ABBR}}" }
first_name = { kind = "first_name" }
last_name = { kind = "last_name" }
birth_date = { kind = "choice", choices = ["1946-05-30", "1958-09-14", "1963-12-01", "1970-03-22", "1977-08-08", "1982-01-17", "1989-06-25", "1994-10-02", "2001-04-11", "2012-07-19", "2018-02-27"] }
sex = { kind = "choice", choices = ["female", "male", "female", "male", "unknown"] }
phone = { kind = "phone" }
email = { kind = "email" }
facility = { kind = "choice", choices = ["{{org.short}} General", "{{org.short}} General", "{{org.short}} Community"] }
portal_enabled = { kind = "bool" }

[[services.postgres.databases.tables]]
name = "encounters"
columns = [
    { name = "encounter_id", type = "int" },
    { name = "patient_id", type = "int" },
    { name = "class", type = "varchar" },
    { name = "status", type = "varchar" },
    { name = "department", type = "varchar" },
    { name = "practitioner_id", type = "int" },
    { name = "start_time", type = "timestamp" },
]

[services.postgres.databases.tables.generator]
count = 200
[services.postgres.databases.tables.generator.fields]
encounter_id = { kind = "seq", min = 880001 }
patient_id = { kind = "int", min = 1001, max = 1123 }
class = { kind = "choice", choices = ["AMB", "AMB", "AMB", "EMER", "IMP"] }
status = { kind = "choice", choices = ["finished", "finished", "in-progress", "planned"] }
department = { kind = "choice", choices = ["Family Medicine", "Cardiology", "Emergency", "Orthopedics", "Pediatrics", "Laboratory"] }
practitioner_id = { kind = "int", min = 1, max = 6 }
start_time = { kind = "datetime", min = 250, max = 318 }

[[services.postgres.databases.tables]]
name = "observations"
columns = [
    { name = "observation_id", type = "int" },
    { name = "patient_id", type = "int" },
    { name = "encounter_id", type = "int" },
    { name = "loinc_code", type = "varchar" },
    { name = "display", type = "varchar" },
    { name = "value", type = "numeric" },
    { name = "unit", type = "varchar" },
    { name = "effective", type = "timestamp" },
]

[services.postgres.databases.tables.generator]
count = 300
[services.postgres.databases.tables.generator.fields]
observation_id = { kind = "seq", min = 4400001 }
patient_id = { kind = "int", min = 1001, max = 1123 }
encounter_id = { kind = "int", min = 880001, max = 880200 }
loinc_code = { kind = "choice", choices = ["8867-4", "8480-6", "8462-4", "2339-0", "29463-7", "8310-5"] }
display = { kind = "choice", choices = ["Heart rate", "Systolic blood pressure", "Diastolic blood pressure", "Glucose", "Body weight", "Body temperature"] }
value = { kind = "amount", min = 36, max = 180 }
unit = { kind = "choice", choices = ["/min", "mm[Hg]", "mg/dL", "kg", "Cel"] }
effective = { kind = "datetime", min = 250, max = 318 }

[[services.postgres.databases.tables]]
name = "practitioners"
columns = [
    { name = "practitioner_id", type = "int" },
    { name = "name", type = "varchar" },
    { name = "specialty", type = "varchar" },
    { name = "email", type = "varchar" },
]
seed_rows = [
    [1, "Dr. {{person:4.full_name}}", "Family Medicine", "{{person:4.email}}"],
    [2, "Dr. {{person:5.full_name}}", "Cardiology", "{{person:5.email}}"],
    [3, "Dr. {{person:6.full_name}}", "Emergency Medicine", "{{person:6.email}}"],
    [4, "Dr. {{person:7.full_name}}", "Orthopedics", "{{person:7.email}}"],
    [5, "Dr. {{person:8.full_name}}", "Pediatrics", "{{person:8.email}}"],
    [6, "Lab Auto-Verify", "Laboratory", "lab-noreply@{{org.domain}}"],
]

[[services.postgres.databases.tables]]
name = "integration_clients"
columns = [
    { name = "client_id", type = "varchar" },
    { name = "description", type = "varchar" },
    { name = "client_secret", type = "varchar", secret = true },
    { name = "scopes", type = "varchar" },
    { name = "active", type = "bool" },
]
seed_rows = [
    ["{{org.abbr}}-portal", "Patient portal backend", "********", "patient/*.read", true],
    ["{{org.abbr}}-analytics-export", "Nightly FHIR bulk export", "{{ht:fhir_client_secret}}", "system/*.read", true],
    ["vendor-imaging-old", "Retired imaging connector", "{{secret:client_secret:imaging_old}}", "system/ImagingStudy.read", false],
]

