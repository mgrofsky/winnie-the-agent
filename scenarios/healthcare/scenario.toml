# Marrowfield Regional Health: an invented two-hospital health system. Every patient is
# synthetic (generated names, MRNs with an MRF prefix, NANP 555-01xx phones, example email
# domains). No real person, provider or facility is represented.

name = "healthcare"
title = "Marrowfield Regional Health EHR integration server"
description = """
An invented regional health system. One integration host serves the patient portal and the
EHR admin console, a FHIR R4-style REST API (Patient, Observation, Encounter), an HL7 v2
MLLP listener for inbound ADT/ORU feeds, a PostgreSQL clinical database and an FTP share
used by the lab and imaging interfaces. Honeytokens sit in the interface engine config,
the lab interface config, the offsite backup script and the FHIR client credentials table.
"""

[identity]
org_name = "Marrowfield Regional Health"
hostname = "ehr-int01"
domain = "marrowfield-health.example"
internal_ips = ["10.20.5.41", "10.20.50.41"]
os_pretty_name = "Rocky Linux 9.4 (Blue Onyx)"
kernel = "Linux ehr-int01 5.14.0-427.22.1.el9_4.x86_64 #1 SMP PREEMPT_DYNAMIC Wed Jun 12 19:43:39 UTC 2024 x86_64 x86_64 x86_64 GNU/Linux"
timezone = "America/Denver"
lures = [
    "/opt/mrh/interface-engine/conf/engine.properties",
    "/opt/mrh/interface-engine/channels/lab-oru-inbound.xml",
    "/opt/mrh/fhir/application.yaml",
    "/opt/mrh/scripts/offsite-backup.sh",
    "/var/log/mrh/mllp/inbound.log",
    "/home/integ/.pgpass",
]

[[identity.users]]
name = "integ"
uid = 1000
gecos = "Integration team"
home = "/home/integ"

[[identity.users]]
name = "fhirsvc"
uid = 1301
gecos = "FHIR API service"
home = "/opt/mrh/fhir"
shell = "/sbin/nologin"

[[identity.users]]
name = "hl7svc"
uid = 1302
gecos = "Interface engine"
home = "/opt/mrh/interface-engine"
shell = "/sbin/nologin"

[ssh]
persona_prompt = """
This is ehr-int01, the clinical integration server for Marrowfield Regional Health, an
invented two-hospital health system (Marrowfield General and Eastbrook Community). It runs
the interface engine in /opt/mrh/interface-engine (Java 17, systemd unit mrh-engine) which
listens for HL7 v2 over MLLP on port 2575 (ADT from registration, ORU from the lab) and
writes to the clinical database; the FHIR R4 API in /opt/mrh/fhir (HAPI-based, unit
mrh-fhir, port 8080 behind nginx) serving /fhir/Patient, /fhir/Observation and
/fhir/Encounter; and the patient portal plus EHR admin console. PostgreSQL 15 on
10.20.50.60 holds the ehr_clinical database. vsftpd shares /srv/interfaces for lab and
imaging vendors (hl7/inbound, hl7/archive, exports). Cron: HL7 archive rotation at 00:30,
/opt/mrh/scripts/offsite-backup.sh at 02:00, nightly FHIR bulk export at 03:00, AIDE at
05:00. Users: integ (sudo), fhirsvc and hl7svc service accounts. All patient data is test
data from the integration environment refresh. Keep every answer consistent with this host.
"""

[[ssh.accounts]]
username = "integ"
password = "Marrowfield1!"

[[ssh.accounts]]
username = "root"
password = "changeme"

# ---- MLLP (HL7 v2) ----------------------------------------------------------------------

[services.mllp]
enabled = true
port = 2575
sending_facility = "MRFLD_EHR"

