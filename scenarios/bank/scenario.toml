# An invented community bank. The organisation, hosts, networks, people, account numbers and
# credentials are {{...}} templates expanded from each sensor's seed (see docs/scenarios.md),
# so no two sensors show the same ones. Card numbers use the non-issued 0000 prefix with
# failing Luhn digits; IBAN-like values use the non-country code XX; account numbers carry
# the organisation's upper-case abbreviation as a prefix. Nothing here is a real institution
# or customer.

name = "bank"
title = "{{org.name}} online banking and core"
description = """
An invented community bank. One host fronts online banking and the back-office portal
(nginx + Java app), exposes a REST API for accounts, cards, transfers and statements, and
shares a PostgreSQL core-banking database, a Redis session cache and an FTP drop for
inbound and outbound payment batch files. Honeytokens sit in the batch-upload script, the
SFTP/FTP partner config, the core DB API client table and a Redis config hash.
"""

[bait]
org_suffixes = ["Savings & Trust", "Community Bank", "Savings Bank", "Bank & Trust", "Federal Savings", "Trust Company"]
domain_words = ["bank", "savings", "trust", "banking"]

[identity]
org_name = "{{org.name}}"
hostname = "{{host:obk}}"
domain = "{{org.domain}}"
internal_ips = ["{{net:app}}.31", "{{net:data}}.31"]
os_pretty_name = "Red Hat Enterprise Linux 9.4 (Plow)"
kernel = "Linux {{host:obk}} 5.14.0-427.24.1.el9_4.x86_64 #1 SMP PREEMPT_DYNAMIC Fri Jun 21 05:23:07 EDT 2024 x86_64 x86_64 x86_64 GNU/Linux"
timezone = "America/New_York"
lures = [
    "/opt/{{org.abbr}}/obk/conf/application.properties",
    "/opt/{{org.abbr}}/batch/bin/upload-batches.sh",
    "/opt/{{org.abbr}}/batch/conf/partners.conf",
    "/etc/redis/redis.conf",
    "/home/svc_batch/.pgpass",
    "/var/log/{{org.abbr}}/obk/audit.log",
]

[[identity.users]]
name = "{{org.abbr}}admin"
uid = 1000
gecos = "Platform admin"
home = "/home/{{org.abbr}}admin"

[[identity.users]]
name = "svc_obk"
uid = 1201
gecos = "Online banking service"
home = "/opt/{{org.abbr}}/obk"
shell = "/sbin/nologin"

[[identity.users]]
name = "svc_batch"
uid = 1202
gecos = "Payment batch service"
home = "/home/svc_batch"

[ssh]
persona_prompt = """
This is {{host:obk}} at {{org.name}}, an invented community bank. It runs the
online banking front end and back-office portal: a Spring Boot 3 app in /opt/{{org.abbr}}/obk
(systemd unit {{org.abbr}}-obk, port 8443 behind nginx 1.26), with config in
/opt/{{org.abbr}}/obk/conf/application.properties. Its REST API lives at /api/v1 (accounts, cards,
transfers, statements). PostgreSQL 16 on {{net:data}}.40 holds the corebank database; Redis 7.2
on localhost:6379 caches sessions (keys sess:*) and rate limits. The payment batch service
in /opt/{{org.abbr}}/batch picks up files dropped by partners via vsftpd under /srv/batches/inbound,
validates them and writes acknowledgements to /srv/batches/outbound. Cron:
/opt/{{org.abbr}}/batch/bin/upload-batches.sh every 15 minutes (pushes settled batches to object
storage), statement generation at 04:00 on the 1st, logrotate, and an AIDE check at 05:00.
Users: {{org.abbr}}admin (sudo), svc_obk and svc_batch service accounts. Keep every answer
consistent with this host.
"""

[[ssh.accounts]]
username = "{{org.abbr}}admin"
password = "{{password:platform_admin}}"

[[ssh.accounts]]
username = "svc_batch"
password = "{{password:svc_batch:user}}"

# ---- PostgreSQL core banking ------------------------------------------------------------

[services.postgres]
enabled = true
port = 5432
version = "16.4"

[services.postgres.policy]
accept = "after_n"
after_n_min = 3
after_n_max = 6

[[services.postgres.accounts]]
username = "obk_app"
password = "{{ht:core_db_password}}"

[[services.postgres.accounts]]
username = "postgres"
password = "{{password:postgres:weak}}"

[[services.postgres.accounts]]
username = "svc_batch"
password = "{{ht:core_db_password}}"

[[services.postgres.databases]]
name = "corebank"
schema_name = "core"

[[services.postgres.databases.tables]]
name = "customers"
columns = [
    { name = "customer_id", type = "int" },
    { name = "first_name", type = "varchar" },
    { name = "last_name", type = "varchar" },
    { name = "email", type = "varchar" },
    { name = "phone", type = "varchar" },
    { name = "segment", type = "varchar" },
    { name = "kyc_status", type = "varchar" },
    { name = "opened_on", type = "date" },
]

[services.postgres.databases.tables.generator]
count = 60
[services.postgres.databases.tables.generator.fields]
customer_id = { kind = "seq", min = 500001 }
first_name = { kind = "first_name" }
last_name = { kind = "last_name" }
email = { kind = "email" }
phone = { kind = "phone" }
segment = { kind = "choice", choices = ["retail", "retail", "retail", "small_business", "private"] }
kyc_status = { kind = "choice", choices = ["verified", "verified", "verified", "pending_review"] }
opened_on = { kind = "date", min = 0, max = 300 }

[[services.postgres.databases.tables]]
name = "accounts"
columns = [
    { name = "account_id", type = "int" },
    { name = "customer_id", type = "int" },
    { name = "account_number", type = "varchar" },
    { name = "iban", type = "varchar" },
    { name = "product", type = "varchar" },
    { name = "currency", type = "varchar" },
    { name = "balance", type = "numeric" },
    { name = "status", type = "varchar" },
]

[services.postgres.databases.tables.generator]
count = 80
[services.postgres.databases.tables.generator.fields]
account_id = { kind = "seq", min = 70001 }
customer_id = { kind = "int", min = 500001, max = 500060 }
account_number = { kind = "account_number", prefix = "{{org.ABBR}}-" }
iban = { kind = "iban_like" }
product = { kind = "choice", choices = ["everyday_checking", "high_yield_savings", "business_checking", "cd_12m"] }
currency = { kind = "const", value = "USD" }
balance = { kind = "amount", min = 12, max = 98000 }
status = { kind = "choice", choices = ["open", "open", "open", "open", "frozen", "dormant"] }

[[services.postgres.databases.tables]]
name = "cards"
columns = [
    { name = "card_id", type = "int" },
    { name = "account_id", type = "int" },
    { name = "pan", type = "varchar" },
    { name = "expiry", type = "varchar" },
    { name = "network", type = "varchar" },
    { name = "status", type = "varchar" },
]

[services.postgres.databases.tables.generator]
count = 50
[services.postgres.databases.tables.generator.fields]
card_id = { kind = "seq", min = 9001 }
account_id = { kind = "int", min = 70001, max = 70080 }
pan = { kind = "card_number" }
expiry = { kind = "choice", choices = ["03/28", "07/28", "11/28", "02/29", "09/29", "12/30"] }
network = { kind = "const", value = "debit" }
status = { kind = "choice", choices = ["active", "active", "active", "blocked", "expired"] }

[[services.postgres.databases.tables]]
name = "transactions"
columns = [
    { name = "txn_id", type = "uuid" },
    { name = "account_id", type = "int" },
    { name = "posted_at", type = "timestamp" },
    { name = "amount", type = "numeric" },
    { name = "direction", type = "varchar" },
    { name = "channel", type = "varchar" },
    { name = "memo", type = "varchar" },
]

[services.postgres.databases.tables.generator]
count = 200
[services.postgres.databases.tables.generator.fields]
txn_id = { kind = "uuid" }
account_id = { kind = "int", min = 70001, max = 70080 }
posted_at = { kind = "datetime", min = 250, max = 317 }
amount = { kind = "amount", min = 2, max = 4800 }
direction = { kind = "choice", choices = ["debit", "debit", "credit"] }
channel = { kind = "choice", choices = ["card", "ach", "wire", "internal_transfer", "atm", "bill_pay"] }
memo = { kind = "choice", choices = ["Payroll deposit", "Grocery", "Utilities autopay", "Rent", "Transfer to savings", "ATM withdrawal", "Insurance premium"] }

[[services.postgres.databases.tables]]
name = "statements"
columns = [
    { name = "statement_id", type = "int" },
    { name = "account_id", type = "int" },
    { name = "period", type = "varchar" },
    { name = "opening_balance", type = "numeric" },
    { name = "closing_balance", type = "numeric" },
    { name = "pdf_path", type = "varchar" },
]

[services.postgres.databases.tables.generator]
count = 40
[services.postgres.databases.tables.generator.fields]
statement_id = { kind = "seq", min = 300001 }
account_id = { kind = "int", min = 70001, max = 70080 }
period = { kind = "choice", choices = ["2026-07", "2026-08", "2026-09", "2026-10"] }
opening_balance = { kind = "amount", min = 50, max = 60000 }
closing_balance = { kind = "amount", min = 50, max = 60000 }
pdf_path = { kind = "const", value = "/srv/statements/pending" }

[[services.postgres.databases.tables]]
name = "api_clients"
columns = [
    { name = "client_id", type = "varchar" },
    { name = "name", type = "varchar" },
    { name = "client_secret", type = "varchar", secret = true },
    { name = "scopes", type = "varchar" },
    { name = "active", type = "bool" },
]
seed_rows = [
    ["{{org.abbr}}-mobile-ios", "Mobile app (iOS)", "", "accounts:read transfers:write", true],
    ["{{org.abbr}}-mobile-android", "Mobile app (Android)", "", "accounts:read transfers:write", true],
    ["{{org.abbr}}-aggregator-feed", "Aggregator data feed", "{{ht:aggregator_api_key}}", "accounts:read statements:read", true],
]

[[services.postgres.databases.tables]]
name = "backoffice_users"
columns = [
    { name = "username", type = "varchar" },
    { name = "full_name", type = "varchar" },
    { name = "role", type = "varchar" },
    { name = "mfa", type = "bool" },
    { name = "last_login", type = "timestamp" },
]
seed_rows = [
    ["bo.{{person:1.username}}", "{{person:1.full_name}}", "ops_manager", true, "2026-11-14 08:02:51"],
    ["bo.{{person:2.username}}", "{{person:2.full_name}}", "fraud_analyst", true, "2026-11-14 07:44:10"],
    ["bo.svc-recon", "Reconciliation job", "service", false, "2026-11-15 04:00:03"],
]

