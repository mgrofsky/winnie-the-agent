# ---- honeytokens ---------------------------------------------------------------------------

[[honeytokens]]
name = "core_db_password"
kind = "db_password"
planted_in = [
    "Redis hash config:obk (db_password)",
    "FTP /scripts/partners.conf ([core-db] password)",
]

[[honeytokens]]
name = "recon_bearer"
kind = "bearer_token"
planted_in = ["Redis string svc:recon:token (back-office reconciliation job bearer token)"]

[[honeytokens]]
name = "batch_aws_key"
kind = "aws_access_key"
planted_in = ["FTP /scripts/upload-batches.sh (AWS_ACCESS_KEY_ID)"]

[[honeytokens]]
name = "aggregator_api_key"
kind = "api_key"
planted_in = [
    "Postgres corebank.api_clients row qst-aggregator-feed (client_secret)",
    "HTTP GET /api/v1/partners/aggregator/config (client_secret)",
]
