# ---- HTTP: online banking, back office, API ---------------------------------------------

[services.http]
enabled = true
port = 8080
server_header = "nginx/1.26.1"
login_path = "/login"
login_title = "{{org.short}} Online Banking - Sign in"
branding = "{{org.name}}. Member FDIC-style deposit insurance notice (sample). Secure online banking."
api_prefix = "/api/v1"

[services.http.policy]
accept = "after_n"
after_n_min = 3
after_n_max = 6

[[services.http.accounts]]
username = "bo.{{person:1.username}}"
password = "{{password:person1}}"

[[services.http.accounts]]
username = "demo.customer"
password = "{{password:demo_customer:weak}}"

[[services.http.pages]]
path = "/accounts"
title = "My Accounts"
