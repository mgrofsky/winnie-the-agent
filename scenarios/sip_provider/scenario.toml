    { name = "id", type = "varchar" },
    { name = "tech", type = "varchar" },
    { name = "dial", type = "varchar" },
    { name = "devicetype", type = "varchar" },
    { name = "user", type = "varchar" },
    { name = "description", type = "varchar" },
    { name = "emergency_cid", type = "varchar" },
]
