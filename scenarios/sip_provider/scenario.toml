#!/bin/bash
# Copy nightly FreePBX backups offsite. Owner: dgallagher
set -euo pipefail
export AWS_ACCESS_KEY_ID={{ht:offsite_aws_key}}
export AWS_DEFAULT_REGION=us-east-2
SRC=/var/spool/asterisk/backup/nightly
DEST=s3://bwv-pbx01-backups/nightly
find "$SRC" -name 'freepbx-backup-*.tar.gz' -mtime -1 -print0 | \
  xargs -0 -I{} aws s3 cp {} "$DEST/" --only-show-errors
logger -t offsite-backup "uploaded $(ls $SRC | wc -l) files"
'''

