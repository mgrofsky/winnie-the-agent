# Bellweather Voice Networks: a small hosted-PBX reseller running FreePBX 16 on Asterisk 18.
# Everything here is invented. Phone numbers use the NANP 555-01xx fictional range.

name = "sip_provider"
title = "Bellweather Voice Networks hosted PBX (FreePBX / Asterisk)"
description = """
A FreePBX 16 / Asterisk 18 PBX run by an invented regional hosted-voice reseller. Exposes SIP
registration on 5060 with numbered extension ranges, the FreePBX admin web UI, the MySQL
CDR and configuration databases, an FTP server holding nightly config backups and voicemail
spool copies, and a legacy telnet console. Honeytokens sit in the trunk config backup, the
FreePBX DB credentials file, an offsite backup script and the REST API application listing.
"""

[identity]
org_name = "Bellweather Voice Networks"
hostname = "pbx01"
domain = "bellweather-voice.example"
internal_ips = ["10.40.8.21", "172.20.1.21"]
os_pretty_name = "Debian GNU/Linux 12 (bookworm)"
kernel = "Linux pbx01 6.1.0-26-amd64 #1 SMP PREEMPT_DYNAMIC Debian 6.1.112-1 (2024-10-22) x86_64 GNU/Linux"
timezone = "America/Chicago"
lures = [
    "/etc/asterisk/pjsip.conf",
    "/etc/asterisk/pjsip.endpoint_custom.conf",
    "/etc/freepbx.conf",
    "/etc/asterisk/manager.conf",
    "/root/.my.cnf",
    "/usr/local/sbin/offsite-backup.sh",
    "/var/spool/asterisk/backup/nightly/freepbx-backup-20261114.tar.gz",
]

[[identity.users]]
name = "asterisk"
uid = 999
gecos = "Asterisk PBX"
home = "/var/lib/asterisk"
shell = "/usr/sbin/nologin"

[[identity.users]]
name = "dgallagher"
uid = 1001
gecos = "Dakota Gallagher (voice eng)"
home = "/home/dgallagher"

[[identity.users]]
name = "voiceops"
uid = 1002
gecos = "Voice NOC shared"
home = "/home/voiceops"

[ssh]
persona_prompt = """
This is pbx01, the production FreePBX 16.0.40 server for Bellweather Voice Networks, a small
hosted-voice reseller. Asterisk 18.20.0 runs as the asterisk user (asterisk -rx works for
root). Config lives in /etc/asterisk (pjsip.conf, extensions_custom.conf, manager.conf) and
/etc/freepbx.conf; voicemail is under /var/spool/asterisk/voicemail/default/<ext>/INBOX;
call recordings under /var/spool/asterisk/monitor/YYYY/MM/DD. MariaDB 10.11 serves the
asterisk and asteriskcdrdb databases on 127.0.0.1:3306. Apache 2.4 with PHP 8.2 serves the
admin UI at /admin. Postfix relays voicemail-to-email via smarthost.bellweather-voice.example.
vsftpd serves /srv/ftp/backups to the backup host 10.40.8.30. Extensions are 1001-1099 for
the main office and 2001-2049 for the Riverside branch; queue 8001 is the support line.
Cron: fwconsole ma refreshsignatures nightly, fwconsole backup --backup=nightly at 02:15,
/usr/local/sbin/offsite-backup.sh at 03:00 (copies backups to object storage), logrotate.
fail2ban is installed but its asterisk jail is disabled. Users dgallagher and voiceops have
sudo. Keep every answer consistent with this host.
"""

[[ssh.accounts]]
username = "root"
password = "Bellweather2024!"

[[ssh.accounts]]
username = "voiceops"
password = "voiceops123"

# ---- SIP --------------------------------------------------------------------------------

[services.sip]
enabled = true
port = 5060
udp = true
tcp = true
realm = "bellweather-voice.example"
server_header = "FPBX-16.0.40(18.20.0)"
extension_ranges = ["1001-1099", "2001-2049", "8001-8009"]
dial_plan_hints = [
    "9 + 10 digits: outbound local and long distance via trunk bwv-carrier-a",
    "9 + 011 + country + number: international (enabled for 1001-1010 only)",
    "*97: voicemail main menu, *98: voicemail for another mailbox",
    "8001: support ring group, 8002: sales queue",
    "*72 / *73: call forward on / off",
]
register_expires = 3600

[services.sip.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

