# A small hosted-PBX reseller running FreePBX 16 on Asterisk 18. Everything here is invented.
# The organisation, hosts, networks, people and credentials are {{...}} templates expanded
# from each sensor's seed (see docs/scenarios.md), so no two sensors show the same ones.
# Phone numbers use the NANP 555-01xx fictional range.

name = "sip_provider"
title = "{{org.name}} hosted PBX (FreePBX / Asterisk)"
description = """
A FreePBX 16 / Asterisk 18 PBX run by an invented regional hosted-voice reseller. Exposes SIP
registration on 5060 with numbered extension ranges, the FreePBX admin web UI, the MySQL
CDR and configuration databases, an FTP server holding nightly config backups and voicemail
spool copies, and a legacy telnet console. Honeytokens sit in the trunk config backup, the
FreePBX DB credentials file, an offsite backup script and the REST API application listing.
"""

[bait]
org_suffixes = ["Voice Networks", "Voice", "Telecom", "Communications", "VoIP", "Telephone"]
domain_words = ["voice", "tel", "voip", "comms"]

[identity]
org_name = "{{org.name}}"
hostname = "{{host:pbx}}"
domain = "{{org.domain}}"
internal_ips = ["{{net:voice}}.21", "{{net:mgmt}}.21"]
os_pretty_name = "Debian GNU/Linux 12 (bookworm)"
kernel = "Linux {{host:pbx}} 6.1.0-26-amd64 #1 SMP PREEMPT_DYNAMIC Debian 6.1.112-1 (2024-10-22) x86_64 GNU/Linux"
timezone = "America/Chicago"
lures = [
    "/etc/asterisk/pjsip.conf",
    "/etc/asterisk/pjsip.endpoint_custom.conf",
    "/etc/freepbx.conf",
    "/etc/asterisk/manager.conf",
    "/root/.my.cnf",
    "/usr/local/sbin/offsite-backup.sh",
    "/var/spool/asterisk/backup/nightly/freepbx-backup-20261114.tar.gz",
]

[[identity.users]]
name = "asterisk"
uid = 999
gecos = "Asterisk PBX"
home = "/var/lib/asterisk"
shell = "/usr/sbin/nologin"

[[identity.users]]
name = "{{person:1.username}}"
uid = 1001
gecos = "{{person:1.full_name}} (voice eng)"
home = "/home/{{person:1.username}}"

[[identity.users]]
name = "voiceops"
uid = 1002
gecos = "Voice NOC shared"
home = "/home/voiceops"

[ssh]
persona_prompt = """
This is {{host:pbx}}, the production FreePBX 16.0.40 server for {{org.name}}, a small
hosted-voice reseller. Asterisk 18.20.0 runs as the asterisk user (asterisk -rx works for
root). Config lives in /etc/asterisk (pjsip.conf, extensions_custom.conf, manager.conf) and
/etc/freepbx.conf; voicemail is under /var/spool/asterisk/voicemail/default/<ext>/INBOX;
call recordings under /var/spool/asterisk/monitor/YYYY/MM/DD. MariaDB 10.11 serves the
asterisk and asteriskcdrdb databases on 127.0.0.1:3306. Apache 2.4 with PHP 8.2 serves the
admin UI at /admin. Postfix relays voicemail-to-email via smarthost.{{org.domain}}.
vsftpd serves /srv/ftp/backups to the backup host {{net:voice}}.30. Extensions are 1001-1099 for
the main office and 2001-2049 for the {{place:1}} branch; queue 8001 is the support line.
Cron: fwconsole ma refreshsignatures nightly, fwconsole backup --backup=nightly at 02:15,
/usr/local/sbin/offsite-backup.sh at 03:00 (copies backups to object storage), logrotate.
fail2ban is installed but its asterisk jail is disabled. Users {{person:1.username}} and voiceops have
sudo. Keep every answer consistent with this host.
"""

[[ssh.accounts]]
username = "root"
password = "{{password:person1}}"

[[ssh.accounts]]
username = "voiceops"
password = "{{password:voiceops:user}}"

# ---- SIP --------------------------------------------------------------------------------

[services.sip]
enabled = true
port = 5060
udp = true
tcp = true
realm = "{{org.domain}}"
server_header = "FPBX-16.0.40(18.20.0)"
extension_ranges = ["1001-1099", "2001-2049", "8001-8009"]
dial_plan_hints = [
    "9 + 10 digits: outbound local and long distance via trunk {{org.abbr}}-carrier-a",
    "9 + 011 + country + number: international (enabled for 1001-1010 only)",
    "*97: voicemail main menu, *98: voicemail for another mailbox",
    "8001: support ring group, 8002: sales queue",
    "*72 / *73: call forward on / off",
]
register_expires = 3600

[services.sip.policy]
accept = "after_n"
after_n_min = 2
after_n_max = 5

[[services.sip.extensions]]
extension = "1001"
password = "{{password:ext1001}}"
display_name = "Reception"

[[services.sip.extensions]]
extension = "1002"
password = "{{password:1002:user}}"
display_name = "{{person:2.full_name}}"

[[services.sip.extensions]]
extension = "1004"
password = "{{password:ext1004}}"
display_name = "{{person:3.full_name}}"

[[services.sip.extensions]]
extension = "1010"
password = "{{password:ext1010}}"
display_name = "NOC Desk"

[[services.sip.extensions]]
extension = "2001"
password = "{{password:2001:user}}"
display_name = "{{place:1}} Front Desk"

[[services.sip.extensions]]
extension = "2007"
password = "{{password:2007:user}}"
display_name = "{{person:4.full_name}}"

# ---- MySQL ------------------------------------------------------------------------------

[services.mysql]
enabled = true
port = 3306
version = "10.11.6-MariaDB-0+deb12u1"

[services.mysql.policy]
accept = "after_n"
after_n_min = 3
after_n_max = 6

[[services.mysql.accounts]]
username = "freepbxuser"
password = "{{ht:freepbx_db_password}}"

[[services.mysql.accounts]]
username = "cdrreader"
password = "{{password:cdrreader:service}}"

[[services.mysql.databases]]
name = "asteriskcdrdb"

[[services.mysql.databases.tables]]
name = "cdr"
columns = [
    { name = "calldate", type = "timestamp" },
    { name = "clid", type = "varchar" },
    { name = "src", type = "varchar" },
    { name = "dst", type = "varchar" },
    { name = "dcontext", type = "varchar" },
    { name = "channel", type = "varchar" },
    { name = "lastapp", type = "varchar" },
    { name = "duration", type = "int" },
    { name = "billsec", type = "int" },
    { name = "disposition", type = "varchar" },
    { name = "accountcode", type = "varchar" },
    { name = "uniqueid", type = "varchar" },
]
seed_rows = [
    ["2026-11-14 09:02:11", "\"Reception\" <1001>", "1001", "+13125550147", "from-internal", "PJSIP/1001-0000a1b2", "Dial", 182, 171, "ANSWERED", "{{org.ABBR}}-MAIN", "1763132531.1201"],
    ["2026-11-14 09:15:40", "\"{{person:2.full_name}}\" <1002>", "1002", "2007", "from-internal", "PJSIP/1002-0000a1c0", "Dial", 41, 35, "ANSWERED", "{{org.ABBR}}-MAIN", "1763133340.1207"],
    ["2026-11-14 10:01:03", "\"Support\" <+16175550112>", "+16175550112", "8001", "from-trunk", "PJSIP/{{org.abbr}}-carrier-a-0000a1d4", "Queue", 305, 290, "ANSWERED", "", "1763136063.1219"],
]

[services.mysql.databases.tables.generator]
count = 60
[services.mysql.databases.tables.generator.fields]
calldate = { kind = "datetime", min = 280, max = 317 }
clid = { kind = "full_name" }
src = { kind = "extension", min = 1001, max = 1030 }
dst = { kind = "phone" }
dcontext = { kind = "choice", choices = ["from-internal", "from-internal", "from-trunk", "ext-queues"] }
channel = { kind = "choice", choices = ["PJSIP/1002-0000b0a1", "PJSIP/1004-0000b0c7", "PJSIP/1010-0000b113", "PJSIP/{{org.abbr}}-carrier-a-0000b2f0"] }
lastapp = { kind = "choice", choices = ["Dial", "Dial", "Queue", "VoiceMail", "Playback"] }
duration = { kind = "int", min = 3, max = 1800 }
billsec = { kind = "int", min = 0, max = 1700 }
disposition = { kind = "choice", choices = ["ANSWERED", "ANSWERED", "ANSWERED", "NO ANSWER", "BUSY", "FAILED"] }
accountcode = { kind = "choice", choices = ["{{org.ABBR}}-MAIN", "{{org.ABBR}}-RIV", ""] }
uniqueid = { kind = "int", min = 1763000000, max = 1763199999 }

[[services.mysql.databases]]
name = "asterisk"

[[services.mysql.databases.tables]]
name = "users"
columns = [
    { name = "extension", type = "varchar" },
    { name = "password", type = "varchar", secret = true },
    { name = "name", type = "varchar" },
    { name = "voicemail", type = "varchar" },
    { name = "ringtimer", type = "int" },
    { name = "outboundcid", type = "varchar" },
    { name = "mohclass", type = "varchar" },
]
seed_rows = [
    ["1001", "", "Reception", "default", 20, "\"{{org.short}}\" <+13125550100>", "default"],
    ["1002", "", "{{person:2.full_name}}", "default", 20, "", "default"],
    ["1004", "", "{{person:3.full_name}}", "default", 25, "", "default"],
    ["1010", "", "NOC Desk", "novm", 15, "\"{{org.ABBR}} NOC\" <+13125550110>", "default"],
    ["2001", "", "{{place:1}} Front Desk", "default", 20, "\"{{org.ABBR}} {{place:1}}\" <+16175550120>", "default"],
    ["2007", "", "{{person:4.full_name}}", "default", 20, "", "default"],
]

[services.mysql.databases.tables.generator]
count = 20
[services.mysql.databases.tables.generator.fields]
extension = { kind = "extension", min = 1011, max = 1099 }
password = { kind = "const", value = "" }
name = { kind = "full_name" }
voicemail = { kind = "choice", choices = ["default", "default", "novm"] }
ringtimer = { kind = "choice", choices = [15, 20, 25, 30] }
