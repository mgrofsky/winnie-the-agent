<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" fill="none" role="img" aria-labelledby="honeypot-title honeypot-description">
  <title id="honeypot-title">Honeypot</title>
  <desc id="honeypot-description">A line drawing of a honey pot with a terminal prompt on it. Data packets move along lines into the pot from the left and out to the right.</desc>
  <style>
    .packet { animation: packet-flow 4s linear infinite; }
    .p2 { animation-delay: -1s; }
    .p3 { animation-delay: -2s; }
    .p4 { animation-delay: -3s; }
    @keyframes packet-flow { from { stroke-dashoffset: 50; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .packet { animation: none; } }
  </style>
  <g stroke="#d9a200" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="1.5" opacity=".55">
      <path d="M48 68h76l38 38h66"/>
