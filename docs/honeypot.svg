      <rect x="35" y="166" width="12" height="12" rx="2"/>
      <rect x="513" y="62" width="12" height="12" rx="2"/>
      <rect x="513" y="166" width="12" height="12" rx="2"/>
    </g>
    <g stroke-width="4" stroke-linecap="butt">
      <path class="packet" pathLength="100" stroke-dasharray="3 47" stroke-dashoffset="9" d="M48 68h76l38 38h66"/>
      <path class="packet p2" pathLength="100" stroke-dasharray="3 47" stroke-dashoffset="24" d="M48 172h76l38-38h66"/>
      <path class="packet p3" pathLength="100" stroke-dasharray="3 47" stroke-dashoffset="31" d="M332 106h66l38-38h76"/>
      <path class="packet p4" pathLength="100" stroke-dasharray="3 47" stroke-dashoffset="16" d="M332 134h66l38 38h76"/>
    </g>
    <g stroke-width="2" opacity=".85">
