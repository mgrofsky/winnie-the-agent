<text x="70" font-size="28" fill="#e9ecef" text-anchor="start">
<tspan x="70" y="68" font-weight="600">Winnie the Agent: data flow</tspan>
</text>
<text x="970" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="970" y="171">Attackers</tspan>
</text>
<text x="720" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="720" y="340" font-weight="600">SSH honeypot</tspan>
<tspan x="720" y="361">LLM persona shell (budgeted)</tspan>
</text>
<text x="1240" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1240" y="330" font-weight="600">Protocol traps</tspan>
<tspan x="1240" y="351">SIP FTP Telnet SMTP HTTP S3 Redis</tspan>
<tspan x="1240" y="372">PostgreSQL MySQL MSSQL HL7</tspan>
</text>
<text x="315" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="315" y="330" font-weight="600">Persona model API</tspan>
<tspan x="315" y="351">(optional; canned replies</tspan>
<tspan x="315" y="372">without a key)</tspan>
</text>
<text x="1700" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1700" y="330" font-weight="600">config.ini + scenario.toml</tspan>
<tspan x="1700" y="351">fake org, accounts, data;</tspan>
<tspan x="1700" y="372">bait generated per sensor</tspan>
</text>
<text x="970" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="970" y="565" font-weight="600">Event log (JSON lines)</tspan>
<tspan x="970" y="586">logins, commands, registers, calls</tspan>
</text>
<text x="1380" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1380" y="565" font-weight="600">Quarantine</tspan>
<tspan x="1380" y="586">uploads by SHA-256, never run</tspan>
</text>
<text x="1070" font-size="14" fill="#868e96" text-anchor="start">
<tspan x="1070" y="722">python -m agents run-all (hourly, separate container)</tspan>
</text>
<text x="470" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="470" y="780" font-weight="600">triage</tspan>
<tspan x="470" y="801">one record per</tspan>
<tspan x="470" y="822">session or campaign</tspan>
</text>
<text x="750" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="750" y="780" font-weight="600">respond</tspan>
<tspan x="750" y="801">playbooks matched</tspan>
<tspan x="750" y="822">by code</tspan>
</text>
<text x="1030" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1030" y="790" font-weight="600">digest</tspan>
<tspan x="1030" y="811">daily top three</tspan>
</text>
<text x="1310" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1310" y="780" font-weight="600">tune</tspan>
<tspan x="1310" y="801">adjust the bait</tspan>
<tspan x="1310" y="822">within a fixed schema</tspan>
</text>
<text x="1590" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1590" y="790" font-weight="600">detect</tspan>
<tspan x="1590" y="811">draft rules</tspan>
</text>
<text x="1870" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1870" y="780" font-weight="600">ship</tspan>
<tspan x="1870" y="801">export events</tspan>
<tspan x="1870" y="822">(optional)</tspan>
</text>
<text x="155" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="155" y="780" font-weight="600">Analyst model API</tspan>
<tspan x="155" y="801">output must pass</tspan>
<tspan x="155" y="822">a schema check</tspan>
</text>
<text x="340" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="340" y="1020" font-weight="600">reports/</tspan>
<tspan x="340" y="1041">triage records,</tspan>
<tspan x="340" y="1062">daily digest, run log</tspan>
</text>
<text x="590" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="590" y="1020" font-weight="600">Per-source state</tspan>
<tspan x="590" y="1041">tarpit, depth,</tspan>
<tspan x="590" y="1062">planted tokens</tspan>
</text>
<text x="820" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="820" y="1020" font-weight="600">Notify connectors</tspan>
<tspan x="820" y="1041">webhook, SIEM, email</tspan>
<tspan x="820" y="1062">(off by default)</tspan>
</text>
<text x="1050" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1050" y="1020" font-weight="600">Approval queue</tspan>
<tspan x="1050" y="1041">enforce actions</tspan>
<tspan x="1050" y="1062">wait here</tspan>
</text>
<text x="1310" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1310" y="1020" font-weight="600">decoy/overlay.json</tspan>
<tspan x="1310" y="1041">accounts, lures,</tspan>
<tspan x="1310" y="1062">SIP extensions</tspan>
</text>
<text x="1595" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1595" y="1020" font-weight="600">detections/pending</tspan>
<tspan x="1595" y="1041">Sigma drafts,</tspan>
<tspan x="1595" y="1062">blocklist candidates</tspan>
</text>
<text x="1875" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1875" y="1020" font-weight="600">S3 bucket for a SIEM</tspan>
<tspan x="1875" y="1041">events, passwords</tspan>
<tspan x="1875" y="1062">hashed by default</tspan>
</text>
<text x="1050" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1050" y="1255" font-weight="600">Operator</tspan>
<tspan x="1050" y="1276">approve / reject</tspan>
</text>
<text x="1380" font-size="16" fill="#e9ecef" text-anchor="middle">
<tspan x="1380" y="1245" font-weight="600">Enforce (after approval only)</tspan>
<tspan x="1380" y="1266">blocklist file, publish detection,</tspan>
<tspan x="1380" y="1287">ticket, block webhook</tspan>
</text>
<text x="670" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="670" y="244">logins, commands</tspan>
</text>
<text x="1140" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="1140" y="244">logins, registers, queries</tspan>
</text>
<text x="465" font-size="14" fill="#b197fc" text-anchor="start">
<tspan x="465" y="409">prompts / replies</tspan>
</text>
<text x="1430" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="1430" y="412">what to fake</tspan>
</text>
<text x="750" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="750" y="464">events</tspan>
</text>
<text x="1130" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="1130" y="464">events</tspan>
</text>
<text x="1370" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="1370" y="464">FTP and S3 uploads</tspan>
</text>
<text x="660" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="660" y="669">read</tspan>
</text>
<text x="663" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="663" y="917">local</tspan>
</text>
<text x="788" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="788" y="917">notify</tspan>
</text>
<text x="940" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="940" y="914">enforce</tspan>
</text>
<text x="1585" font-size="14" fill="#e9ecef" text-anchor="start">
<tspan x="1585" y="1182">published on approval</tspan>
</text>
<text x="2065" font-size="14" fill="#69db7c" text-anchor="start">
<tspan x="2065" y="564">feedback, read-only</tspan>
<tspan x="2065" y="582">for the front-ends:</tspan>
<tspan x="2065" y="601">overlay and</tspan>
<tspan x="2065" y="619">per-source state</tspan>
</text>
<text x="70" font-size="16" fill="#e9ecef" text-anchor="start">
<tspan x="70" y="1356">Front-ends only write events. Agents never talk to attackers. Models get no tools.</tspan>
<tspan x="70" y="1377">Nothing outside the honeypot changes without the operator's approval.</tspan>
</text>
</svg>
