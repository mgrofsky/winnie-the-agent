<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2265 1420" width="2265" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Winnie the Agent data flow</title>
<desc id="d">Attackers connect to the SSH honeypot and the protocol traps, which write one event log. An hourly agents pipeline reads the log and runs triage, respond, digest, tune, detect and an optional export to S3. Its outputs are reports, per-source state, notifications, an approval queue, the overlay file and detection drafts. Enforcement happens only after the operator approves. The overlay and per-source state feed back to the front-ends read-only.</desc>
