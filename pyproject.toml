[project]
name = "winnie-the-agent"
version = "0.1.0"
description = "LLM-driven SSH honeypot with multi-protocol login traps, scenario packs, triage, decoy tuning and response playbooks (based on DECEIVE)"
readme = "README.md"
license = "MIT"
keywords = ["honeypot", "deception", "ssh", "sip", "threat-intelligence", "llm"]
requires-python = ">=3.11"
dependencies = [
    "asyncssh",
    "langchain-core",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-aws",
    "boto3",
    "botocore",
    "anthropic",
    "langchain-anthropic>=1.7.10",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Country, city and network owner of source addresses, read from .mmdb files on disk
# ([geoip] in config.ini). Without it the lookup is off and nothing else changes.
geoip = ["maxminddb>=2.6"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # Checks of the portable outputs (docs/portable-formats.md): Sigma rules are parsed and
    # converted with the Sigma project's own library and two published backends, STIX
    # bundles are checked with the OASIS validator. Not needed at run time.
    # The Elasticsearch and OpenSearch backends require pySigma below 2.0.
    "pysigma==1.5.1",
    "pysigma-backend-elasticsearch==2.1.1",
    "pysigma-backend-opensearch==2.0.3",
    "stix2==3.0.2",
    "stix2-validator==3.3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Slow tests (pathological-input timing, large-history runs) are skipped by default;
# run everything with: uv run pytest -m "slow or not slow"
addopts = "-m 'not slow'"
markers = ["slow: long-running timing and scale tests (excluded from the default run)"]

[tool.uv]
package = false
